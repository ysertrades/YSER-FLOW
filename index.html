<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what activates env(safe-area-inset-*). Without it
         every inset resolves to 0px and the safe-area handling in the app
         silently does nothing on a real iPhone. -->

    <meta name="theme-color" content="#121212" />
    <meta name="color-scheme" content="dark" />
